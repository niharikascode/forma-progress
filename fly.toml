app = "forma-progress-niharika"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  LOCAL_MODE = "false"
  DATABASE_PATH = "/data/forma.sqlite"
  APP_USERNAME = "niharika"

[mounts]
  source = "forma_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
